name: BTC Derivatives Collector

on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각 (UTC) 실행
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-derivatives-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 파생지표 수집 (OKX + CoinGecko)
        run: python scripts/btc_derivatives_collector.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/btc_derivatives.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: BTC 파생지표 자동 수집 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
