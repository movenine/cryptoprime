name: BTC Derivatives Log Sync

on:
  schedule:
    - cron: '37 * * * *'   # 매시 37분 (UTC) — 매시 5분에 예약 실행이 전혀 발동하지 않아 시각 조정
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 단위 테스트 (해석 로직)
        run: python -m unittest discover -s tests -v

      - name: 구글시트 동기화 + 해석 계산
        run: python scripts/btc_sheet_sync.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/btc_derivatives_log.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: BTC Derivatives Log 구글시트 동기화 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
