name: Reuters ROI Article Fetch Test (1회성)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 로이터 ROI 개별 기사 패치 테스트
        run: python scripts/test_reuters_fetch.py
